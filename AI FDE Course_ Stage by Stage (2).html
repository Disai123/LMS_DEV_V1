<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI FDE Course: Stage by Stage</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--fg:#17202e;--mut:#5d6a7c;--line:#d9e0ea;--c1:#0c9b6a;--c2:#2563d6;--lnk:#2563d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#090d16;--card:#0f1626;--fg:#e8ecf4;--mut:#8f9bb0;--line:#243047;--c1:#34d399;--c2:#5b9cf5;--lnk:#5b9cf5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:820px;margin:0 auto;padding:32px 18px 64px}
a{color:var(--lnk);text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:0 0 8px}.sub{color:var(--mut);margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:22px 24px;margin-bottom:20px}
.c1{--a:var(--c1);border-left-color:var(--c1)}.c2{--a:var(--c2);border-left-color:var(--c2)}
.c1{--a:#2fd3a0;border-color:#2fd3a0}.c2{--a:#3aa6ff;border-color:#3aa6ff}.c3{--a:#a074ff;border-color:#a074ff}.c4{--a:#ffd23a;border-color:#ffd23a}.c5{--a:#ff5a7a;border-color:#ff5a7a}.c6{--a:#27c4c4;border-color:#27c4c4}.c7{--a:#ff9a2f;border-color:#ff9a2f}.c8{--a:#7a8cff;border-color:#7a8cff}.c9{--a:#ff5fa8;border-color:#ff5fa8}.c10{--a:#27d3e0;border-color:#27d3e0}
h2{font-size:1.2rem;font-weight:700;letter-spacing:-.01em;color:var(--a);margin:0}.meta{color:var(--mut);font-size:.82rem;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--line);margin-bottom:14px;max-width:260px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.card>p{margin:0 0 4px;font-size:.94rem;line-height:1.65}
h3{font-size:.7rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:22px 0 10px}

.pts li{color:var(--mut)}

.rows a:hover{border-color:var(--a);background:var(--bg);text-decoration:none}.rows a.done{opacity:.6}.rows a.done .t{text-decoration:line-through}
.tag{flex:none;width:76px;text-align:center;border:1px solid var(--a);color:var(--a);border-radius:4px;padding:1px 0;font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.t{flex:1;line-height:1.4}.m{flex:none;color:var(--mut);font-size:.78rem;font-variant-numeric:tabular-nums}
.ready{margin:20px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:.88rem;line-height:1.6;color:var(--mut)}.ready strong{color:var(--fg)}
.crumb{font-size:.74rem;color:var(--mut);margin-bottom:18px}.crumb a{color:var(--mut)}.crumb a:hover{color:var(--fg)}
.d{padding:28px 30px}.d h1{font-size:1.85rem;margin:6px 0 14px}.d .lead{color:var(--mut);font-size:1.02rem;line-height:1.65;margin:0}
.d .meta .tag{display:inline-block;width:auto;padding:1px 6px;margin:0 2px}
.d h4{font-size:1.05rem;font-weight:600;letter-spacing:-.005em;margin:28px 0 10px;padding-top:22px;border-top:1px solid var(--line);color:var(--fg)}
.prose{font-size:.94rem;line-height:1.7;color:var(--mut);overflow-wrap:anywhere}
.prose p{margin:0 0 12px}.prose>:last-child{margin-bottom:0}.prose strong{color:var(--fg);font-weight:600}
.prose h5{font-size:.95rem;font-weight:600;color:var(--fg);margin:20px 0 8px}
.prose ul{list-style:disc;margin:0 0 12px;padding-left:22px}.prose ol{list-style:decimal;margin:0 0 12px;padding-left:22px}
.prose li{margin:5px 0;padding-left:3px}.prose li::marker{color:var(--mut)}.prose ol>li::marker{font-weight:600}
.prose code{font:.85em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.prose pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin:14px 0;overflow-x:auto;line-height:1.55}
.prose pre code{display:block;font-size:.8rem;white-space:pre;background:none;border:0;padding:0}
.extras{margin-top:28px;padding-top:4px;border-top:1px solid var(--line)}
.btn{padding:9px 16px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;font:inherit;font-size:.86rem;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--c1)}.btn.on{background:var(--c1);border-color:var(--c1);color:#04210f}
.foot{margin-top:32px;padding-top:22px;border-top:1px solid var(--line)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;font-size:.88rem}
.nav a{display:block;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:11px 15px;color:var(--fg)}.nav a:hover{border-color:var(--mut);text-decoration:none}
.nav small{display:block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}.nav .nx{text-align:right}
</style></head><body><main id="app"></main>

>Validate model output with Pydantic and run many calls concurrently without hitting rate limits.<\/p>"}],"objectives":["Model data with type hints and Pydantic, including custom validators","Run concurrent calls with asyncio and cap concurrency with a semaphore","Handle validation failures with a repair or retry step"],"checkpointQuestions":["Why validate LLM output even when the prompt asks for JSON?","How do you run 50 parallel calls without hitting rate limits?"]},"s1-4":{"summary":"Wrap a model call in a FastAPI service, test it with mocked LLM calls and make failures debuggable.","sections":[{"heading":"Focus","html":"<p>Wrap a model call in a FastAPI service, test it with mocked LLM calls and make failures debuggable.<\/p>"}],"objectives":["Expose a model call through FastAPI with request and response models","Write pytest tests and mock LLM calls","Add structured logging and debug failures"],"checkpointQuestions":["How do you test code that calls a non-deterministic model?","How would you scope a vague client request into a measurable task?"]},"s1-5":{"summary":"Build a command-line tool that reads a file, cleans it and reports counts and errors.","sections":[{"heading":"Focus","html":"<p>Build a command-line tool that reads a file, cleans it and reports counts and errors.<\/p>"}],"objectives":["Read and clean a messy input file","Handle bad lines without crashing","Report counts and a short summary"],"checkpointQuestions":["What did you do with rows that could not be parsed?","How would the tool behave on a file ten times larger?"]},"s1-6":{"summary":"Classify 50 support tickets concurrently into validated JSON.","sections":[{"heading":"Focus","html":"<p>Classify 50 support tickets concurrently into validated JSON.<\/p>"}],"objectives":["Run calls concurrently with a concurrency limit","Parse each reply into a Pydantic model","Retry or repair invalid replies"],"checkpointQuestions":["How many replies failed validation, and why?","What concurrency limit did ncy constraints.<\/p>"}],"objectives":["Compare frontier, open-weight and small models on cost, latency, quality and privacy","Choose between hosted APIs, Hugging Face models and local inference such as Ollama","Complete a model-selection matrix for data residency and vendor approval limits"],"checkpointQuestions":["Which model would you pick for a client that cannot send data outside its network?","What would you test before committing to a model?"]},"s2-2":{"summary":"Write prompts that hold up under change, and keep them versioned and out of code.","sections":[{"heading":"Focus","html":"<p>Write prompts that hold up under change, and keep them versioned and out of code.<\/p>"}],"objectives":["Use system, user and assistant roles with zero-shot, few-shot and chain-of-thought prompting","Build prompt templates and version them","Decide when prompting is enough and when fine-tuning is justified"],"checkpointQuestions":["How do you know a prompt change actually improved results?","When would you choose fine-tuning over prompting?"]},"s2-3":{"summary":"Get dependable JSON from models and let them call tools through a controlled loop.","sections":[{"heading":"Focus","html":"<p>Get dependable JSON from models and let them call tools through a controlled loop.<\/p>"}],"objectives":["Use JSON mode and schema-constrained output, and handle invalid output","Explain the tool-calling request, execution and response loop","Write clear tool descriptions and recover from tool errors"],"checkpointQuestions":["What should the assistant do when a tool fails?","How do tool descriptions affect which tool gets called?"]},"s2-4":{"summary":"Replace “looks good” with eval sets, and control cost, latency and basic safety risks.","sections":[{"heading":"Focus","html":"<p>Replace “looks good” with eval sets, and control cost, latency and basic safety risks.<\/p>"}],"objectives":["Build a golden dataset and use LLM-as-judge while knowing its biases","Reduce cost and latency with caching, batching, streaming and routing","Identify prompt injection, PII and data-leakage risks"],"checkpointQuestions":["What evidence would convince a client that the model is good enough?","Which safety risk would you raise first in discovery?"]},"s2-5":{"summary":"Understand the RAG architecture and why messy document parsing decides retrieval quality.","sections":[{"heading":"Focus","html":"<p>Understand the RAG architecture and why messy document parsing decides retrieval quality.<\/p>"}],"objectives":["Compare RAG, fine-tuning and long-context prompting","Describe ingestion, indexing, retrieval and generation","Parse PDFs, tables and scans, and capture metadata such as source, date and access level"],"checkpointQuestions":["Why does RAG fail on harder questions in a naive pipeline?","What metadata would you capture for every document?"]},"s2-6":{"summary":"Choose chunking, embedding models and vector stores based on evidence from your own corpus.","sections":[{"heading":"Focus","html":"<p>Choose chunking, embedding models and vector stores based on evidence from your own corpus.<\/p>"}],"objectives":["Compare fixed, recursive, semantic and structure-aware chunking","Choose embedding models and weigh dimensions, cost and re-embedding","Compare FAISS, Chroma, pgvector and managed stores, including HNSW and IVF indexes"],"checkpointQuestions":["Which chunk size would you start with, and how would you test it?","Which vector store fits a client already running PostgreSQL?"]},"s2-7":{"summary":"Raise retrieval quality with hybrid search, rerankers and smarter queries.","sections":[{"heading":"Focus","html":"<p>Raise retrieval quality with hybrid search, rerankers and smarter queries.<\/p>"}],"objectives":["Combine BM25 and dense search with reciprocal rank fusion","Apply cross-encoder reranking and tune top-k and MMR","Use query rewriting, multi-query, HyDE and parent-document retrieval"],"checkpointQuestions":["Which question types does each technique help most?","How do you measure that a reranker helped?"]},"s2-8":{"summary":"Measure retrieval and answer quality, then prepare a RAG service for enterprise use.","sections":[{"heading":"Focus","html":"<p>Measure retrieval and answer quality, then prepare a RAG service for enterprise use.<\/p>"}],"objectives":["Use recall@k, precision@k, MRR and nDCG, plus faithfulness and context precision with RAGAS","Run error analysis to tell retrieval, chunking, prompting and model failures apart","Plan permission-aware retrieval, freshness, caching, cost and observability"],"checkpointQuestions":["Is a wrong answer a retrieval problem or a generation problem? How do you tell?","How do you stop users retrieving documents they may not see?"]},"s2-9":{"summary":"Learn the agent loop and workflow patterns, and when an agent is the wrong choice.","sections":[{"heading":"Focus","html":"<p>Learn the agent loop and workflow patterns, and when an agent is the wrong choice.<\/p>"}],"objectives":["Explain the agent loop, ReAct and the main workflow patterns","Decide between a workflow and a true agent for a use case","Build agents with LangChain tools and retrievers"],"checkpointQuestions":["Would a workflow be enough for this client use case?","What can go wrong when an agent picks its own tools?"]},"s2-10":{"summary":"Model agent behaviour as a graph with persistence, approvals and multiple agents.","sections":[{"heading":"Focus","html":"<p>Model agent behaviour as a graph with persistence, approvals and multiple agents.<\/p>"}],"objectives":["Use graph state, nodes, edges, conditional routing and reducers","Add checkpointing, memory and resumable runs","Add human approval interrupts and a supervisor with specialist agents"],"checkpointQuestions":["Which actions in this workflow should need human approval?","How do you resume a run after a failure?"]},"s2-11":{"summary":"Make retrieval a tool the agent can grade, rewrite and retry.","sections":[{"heading":"Focus","html":"<p>Make retrieval a tool the agent can grade, rewrite and retry.<\/p>"}],"objectives":["Describe document grading and query-rewrite loops","Compare corrective RAG, Self-RAG and adaptive routing","Weigh agentic RAG against standard RAG on cost, latency and reliability"],"checkpointQuestions":["When is the extra cost of agentic RAG worth it?","What is your fallback when retrieval keeps failing?"]},"s2-12":{"summary":"Constrain what agents can see and do, and defend them against injection.","sections":[{"heading":"Focus","html":"<p>Constrain what agents can see and do, and defend them against injection.<\/p>"}],"objectives":["Apply input and output validation and PII redaction","Scope tool permissions with least privilege and sandboxing","Defend against direct and indirect prompt injection with approval gates and spend, step and rate limits"],"checkpointQuestions":["What is the worst action this agent could take, and what stops it?","How would an attacker use a retrieved document against it?"]},"s2-13":{"summary":"Trace agent runs and evaluate trajectories, tool use and cost per task.","sections":[{"heading":"Focus","html":"<p>Trace agent runs and evaluate trajectories, tool use and cost per task.<\/p>"}],"objectives":["Use tracing tools such as LangSmith, Langfuse or OpenTelemetry","Evaluate trajectory quality, tool-call accuracy and task success","Build regression suites and plan deployment, versioning and fallbacks"],"checkpointQuestions":["How would you debug an agent that fails one run in twenty?","What would be on your production dashboard?"]},"s2-14":{"summary":"Learn how MCP standardises tool and data access for agents and applications.","sections":[{"heading":"Focus","html":"<p>Learn how MCP standardises tool and data access for agents and applications.<\/p>"}],"objectives":["Describe the host, client and server architecture and the tools, resources and prompts primitives","Compare stdio and HTTP transports and use existing servers","Apply authentication and trust-boundary practices for MCP servers"],"checkpointQuestions":["Why use MCP instead of hard-coding each tool?","Which MCP servers would you refuse to trust, and why?"]},"s2-15":{"summary":"Package reusable capabilities and speed up AI-assisted delivery.","sections":[{"heading":"Focus","html":"<p>Package reusable capabilities and speed up AI-assisted delivery.<\/p>"}],"objectives":["Explain SKILL.md structure, progressive loading and bundled scripts","Use Cursor rules and project instruction files for consistent coding","Choose between skills, MCP and plain tools, and hand work over to a client team"],"checkpointQuestions":["Which parts of your delivery work would you turn into a skill?","How would a client team maintain it after you leave?"]},"s2-16":{"summary":"Compare two models on the same extraction task and report quality, cost and latency.","sections":[{"heading":"Focus","html":"<p>Compare two models on the same extraction task and report quality, cost and latency.<\/p>"}],"objectives":["Build a small eval set and scoring harness","Measure quality, cost and latency for both models","Validate an LLM-as-judge scorer against human labels"],"checkpointQuestions":["Which model would you recommend and why?","Where did the judge disagree with humans?"]},"s2-17":{"summary":"Build a schema-based extractor and an assistant with calculator, database and web API tools.","sections":[{"heading":"Focus","html":"<p>Build a schema-based extractor and an assistant with calculator, database and web API tools.<\/p>"}],"objectives":["Return a Pydantic schema from an extraction prompt","Wire up three tools in a tool-calling loop","Show how the assistant handles a failing tool"],"checkpointQuestions":["How does the assistant behave when a tool returns garbage?","What did you add to your tool descriptions to fix wrong calls?"]},"s2-18":{"summary":"Build a Q&A assistant over a policy corpus that cites sources and declines out-of-scope questions.","sections":[{"heading":"Focus","html":"<p>Build a Q&amp;A assistant over a policy corpus that cites sources and declines out-of-scope questions.<\/p>"}],"objectives":["Ingest and index the corpus with a chosen chunking strategy","Return cited answers with grounded prompts","Decline questions the documents cannot answer"],"checkpointQuestions":["How do you know every citation is correct?","What happens with a question outside the corpus?"]},"s2-19":{"summary":"Add BM25 and a reranker to the Policy Assistant and measure the change.","sections":[{"heading":"Focus","html":"<p>Add BM25 and a reranker to the Policy Assistant and measure the change.<\/p>"}],"objectives":["Combine keyword and vector retrieval","Add a reranker and tune top-k","Compare retrieval quality before and after"],"checkpointQuestions":["Which questions improved and which got worse?","What top-k did you settle on?"]},"s2-20":{"summary":"Use evaluation results to find and fix bad chunks, stale data and weak retrieval.","sections":[{"heading":"Focus","html":"<p>Use evaluation results to find and fix bad chunks, stale data and weak retrieval.<\/p>"}],"objectives":["Run retrieval and answer metrics on a test set","Locate each failure in the pipeline","Show before and after results for each fix"],"checkpointQuestions":["How did you prove each fix worked?","Which failure was hardest to spot?"]},"s2-21":{"summary":"Deliver an API with hybrid retrieval, reranking, permission filtering and an evaluation suite.","sections":[{"heading":"Focus","html":"<p>Deliver an API with hybrid retrieval, reranking, permission filtering and an evaluation suite.<\/p>"}],"objectives":["Filter retrieval by document permissions","Ship an evaluation suite with the service","Write a deployment and risk note for the client’s IT team"],"checkpointQuestions":["How do permissions flow from the source system into retrieval?","What would you monitor after launch?"]},"s2-22":{"summary":"Add checkpointing and an approval step before a risky action.","sections":[{"heading":"Focus","html":"<p>Add checkpointing and an approval step before a risky action.<\/p>"}],"objectives":["Build the agent as a LangGraph graph","Pause for human approval before a risky action","Resume, edit or reject the action"],"checkpointQuestions":["Which action did you gate and why?","How is state restored after a restart?"]},"s2-23":{"summary":"Build agentic RAG in LangGraph with grading, rewriting and human fallback.","sections":[{"heading":"Focus","html":"<p>Build agentic RAG in LangGraph with grading, rewriting and human fallback.<\/p>"}],"objectives":["Grade retrieved documents and rewrite weak queries","Route to a human when confidence stays low","Compare results with the Day 20 service on the same eval set"],"checkpointQuestions":["Did the agentic version beat the baseline, and at what cost?","When does it fall back to a human?"]},"s2-24":{"summary":"Add at least two guardrails, then attack each other’s agents and fix what breaks.","sections":[{"heading":"Focus","html":"<p>Add at least two guardrails, then attack each other’s agents and fix what breaks.<\/p>"}],"objectives":["Add input and output guardrails","Attack with direct and indirect prompt injection","Write a threat model with mitigations"],"checkpointQuestions":["Which attack got through first?","What residual risk would you tell the client about?"]},"s2-25":{"summary":"Build a Python MCP server that exposes policy search and a ticketing tool, and connect it to the agent.","sections":[{"heading":"Focus","html":"<p>Build a Python MCP server that exposes policy search and a ticketing tool, and connect it to the agent.<\/p>"}],"objectives":["Expose tools and a resource through an MCP server","Connect it to the LangGraph agent and to Claude or Cursor","Add input validation and access checks"],"checkpointQuestions":["What can an MCP client do that you did not intend?","How would you authenticate the server in production?"]},"s2-26":{"summary":"Deliver a multi-agent Q&A system that adds one layer a day: retrieval, agents, tools, safety and quality.","sections":[{"heading":"Focus","html":"<p>Deliver a multi-agent Q&amp;A system that adds one layer a day: retrieval, agents, tools, safety and quality.<\/p>"}],"objectives":["Combine advanced RAG, a LangGraph supervisor, an MCP server and guardrails","Add tracing, an evaluation suite and a regression check","Deliver the repository, architecture diagram, evaluation report and handoff document with a live demo"],"checkpointQuestions":["What are the system’s known limitations?","What would you improve with another two weeks?"]},"s2-27":{"summary":"Practise explaining RAG from ingestion to evaluation to a client or interviewer.","sections":[{"heading":"Focus","html":"<p>Practise explaining RAG from ingestion to evaluation to a client or interviewer.<\/p>"}],"objectives":["Walk through ingestion, chunking, retrieval, reranking and generation","Name the main failure modes and how you evaluate them","Cover access control and freshness"],"checkpointQuestions":["Can you explain this in two minutes without jargon?","What would you verify on a customer project before relying on it?"]},"s2-28":{"summary":"Design an agent for a client use case and defend your safety choices.","sections":[{"heading":"Focus","html":"<p>Design an agent for a client use case and defend your safety choices.<\/p>"}],"objectives":["Choose between a workflow and an agent, and justify it","Describe tools, permissions, approvals and limits","Explain how you would evaluate and monitor it"],"checkpointQuestions":["Where does a human stay in the loop?","How do you handle prompt injection?"]},"s3-0":{"summary":"Forward Deployed Engineers align customer problems with deliverable software through discovery, design, build, and handover.","sections":[{"heading":"Overview","html":"<p>A <strong>Forward Deployed Engineer (FDE)<\/strong> combines engineering with customer delivery: clarify the problem, document scope, implement incrementally, validate with evidence, and hand over runnable artifacts.<\/p><p><strong>Typical sequence in this workshop:<\/strong><\/p><ol><li><strong>Discovery<\/strong> — stakeholders, constraints, success measures.<\/li><li><strong>Design<\/strong> — UI flow and solution architecture.<\/li><li><strong>Development<\/strong> — working software on localhost.<\/li><li><strong>MVP/POC<\/strong> — repeatable run and pilot validation.<\/li><li><strong>Production<\/strong> — hosted deployment and operations.<\/li><li><strong>Enterprise handover<\/strong> — security, observability, and sponsor readout.<\/li><\/ol><p><strong>Customer for Stages 3–9: a retail company (HQ and stores)<\/strong><\/p><ul><li>Approximately <strong>50 employees<\/strong> across stores and head office.<\/li><li>IT receives <strong>100 messages per week<\/strong>; many repeat password, Wi‑Fi, VPN, and device questions.<\/li><li>Answers exist in <strong>~15 FAQ documents<\/strong> (PDF or Word). Staff rarely read them.<\/li><li><strong>IT lead (sponsor)<\/strong> wants an internal <strong>Ask IT<\/strong> page: typed question, cited answer from FAQs, or a clear escalation to IT.<\/li><li>One <strong>restricted FAQ<\/strong> (“Admin-only IT notes”) must not appear in answers for standard staff. Only <strong>admin<\/strong> role may retrieve content from that source.<\/li><li><strong>Phase 1 scope:<\/strong> FAQ assistant only—not a full ticketing or HR system.<\/li><\/ul>"},{"heading":"Procedure","html":"<ol><li>Review the retail case above.<\/li><li>Write one sentence describing the business problem.<\/li><li>Write one sentence describing measurable success for the IT lead.<\/li><\/ol>"},{"heading":"Pitfalls","html":"<ul><li>Opening with technology choices before scope is agreed.<\/li><li>Skipping written notes after stakeholder conversations.<\/li><li>Expanding scope beyond the FAQ assistant in phase 1.<\/li><\/ul>"}],"objectives":["Summarize the FDE delivery sequence","State the retail IT problem in one sentence"],"checkpointQuestions":["What is phase 1 in scope?","Who is the sponsor?"]},"s3-1":{"summary":"Structured questions covering problem, users, FAQ sources, restricted content, and success metrics.","sections":[{"heading":"Overview","html":"<p>Run a <strong>30–45 minute discovery<\/strong> with the IT lead. Capture answers under five headings:<\/p><ol><li><strong>Current state<\/strong> — how employees obtain IT answers today.<\/li><li><strong>Users<\/strong> — who will use Ask IT (all staff, stores only, etc.).<\/li><li><strong>Knowledge base<\/strong> — location, format, and count of FAQ documents; update process.<\/li><li><strong>Restrictions<\/strong> — documents or topics that must not appear for standard staff.<\/li><li><strong>Success<\/strong> — metric the sponsor will use (for example, reduction in repeat FAQ emails).<\/li><\/ol><p>Send a short confirmation note after the session: “This is what we understood—please correct any errors.”<\/p>"},{"heading":"Example: Retail case","html":"<ul><li>Volume: ~100 IT emails weekly; high repetition on access and device topics.<\/li><li>Users: ~50 employees; IT lead owns FAQ maintenance.<\/li><li>Restricted FAQ: admin-only file; must not surface for staff role.<\/li><li>Success: measurable drop in repeat FAQ-style emails within two months.<\/li><\/ul>"},{"heading":"Template","html":"<pre><code>DISCOVERY NOTES\nProblem:\nUsers:\nFAQ sources:\nRestricted content:\nSuccess metric:\nOpen questions:<\/code><\/pre>"}],"objectives":["List five discovery areas","Draft at least eight specific questions"],"checkpointQuestions":["Which area covers restricted FAQs?","Why confirm notes with the sponsor?"]},"s3-2":{"summary":"Goal, users, in-scope and out-of-scope items, and a measurable success criterion on a single page.","sections":[{"heading":"Overview","html":"<p>The <strong>BRD<\/strong> is a one-page agreement: what will be built, what will not, and how success is measured. The IT lead should review it in about five minutes.<\/p><p><strong>Required sections:<\/strong> goal, users, in scope, out of scope, success metric, open questions, approval line.<\/p><p><strong>Phase 1 in scope (retail case):<\/strong> Ask IT page, answers from approved FAQs with source file name, refusal when no match, role-based exclusion of admin-only content.<\/p><p><strong>Out of scope (examples):<\/strong> full ticketing, automated email replies, mobile-native app, company SSO integration.<\/p>"},{"heading":"Template","html":"<pre><code>RETAIL — ASK IT (BRD v1)\nGoal:\nUsers:\nIn scope:\nOut of scope:\nSuccess metric:\nApproved by: ______  Date: ______<\/code><\/pre>"}],"objectives":["Complete all BRD sections","Include one numeric success metric"],"checkpointQuestions":["Why document out-of-scope items?","Name one out-of-scope capability"]},"s3-3":{"summary":"Run discovery against the retail case, then produce notes and a one-page BRD.","sections":[{"heading":"Procedure","html":"<ol><li>Conduct a structured discovery session (partner or scripted sponsor).<\/li><li>Produce half a page of discovery notes.<\/li><li>Draft the one-page BRD from the template.<\/li><li>Peer review: can a reader understand scope without verbal explanation?<\/li><\/ol>"},{"heading":"Pitfalls","html":"<ul><li>Missing out-of-scope section<\/li><li>No success metric<\/li><\/ul>"}],"objectives":["Discovery notes and BRD v1 complete","One round of peer feedback"],"checkpointQuestions":["What changed after peer review?"]},"s3-4":{"summary":"Respond professionally when the sponsor requests an AI assistant over internal documents.","sections":[{"heading":"Overview","html":"<p>Lead with discovery questions and a written scope summary—not infrastructure details.<\/p>"},{"heading":"Example: Retail case","html":"<p>\"I would confirm the business problem, intended users, document locations, any restricted sources, and how success will be measured. I would capture that in a one-page BRD and agree on a first deliverable: the Ask IT FAQ assistant before any ticketing expansion.\"<\/p>"}],"objectives":["Cover users, data, restrictions, and success","Propose a bounded first deliverable"],"checkpointQuestions":["What is the phase 1 deliverable?"]},"s4-0":{"summary":"Citation of FAQ source, explicit uncertainty, and escalation when the assistant cannot answer.","sections":[{"heading":"Overview","html":"<p><strong>Customer for Stages 3–9: a retail company (HQ and stores)<\/strong><\/p><ul><li>Approximately <strong>50 employees<\/strong> across stores and head office.<\/li><li>IT receives <strong>100 messages per week<\/strong>; many repeat password, Wi‑Fi, VPN, and device questions.<\/li><li>Answers exist in <strong>~15 FAQ documents<\/strong> (PDF or Word). Staff rarely read them.<\/li><li><strong>IT lead (sponsor)<\/strong> wants an internal <strong>Ask IT<\/strong> page: typed question, cited answer from FAQs, or a clear escalation to IT.<\/li><li>One <strong>restricted FAQ<\/strong> (“Admin-only IT notes”) must not appear in answers for standard staff. Only <strong>admin<\/strong> role may retrieve content from that source.<\/li><li><strong>Phase 1 scope:<\/strong> FAQ assistant only—not a full ticketing or HR system.<\/li><\/ul><p><strong>Required UI elements:<\/strong><\/p><ol><li><strong>Question input<\/strong> — single field and submit action.<\/li><li><strong>Answer panel<\/strong> — concise text plus <strong>FAQ file name<\/strong> used.<\/li><li><strong>No-answer state<\/strong> — clear message and contact path to IT.<\/li><li><strong>Trust line<\/strong> — answers are FAQ-based; users should verify critical actions with IT.<\/li><li><strong>Optional feedback<\/strong> — thumbs up/down for the IT lead to review.<\/li><\/ol><p>Do not present the assistant as infallible.<\/p>"},{"heading":"Template","html":"<pre><code>UI CHECKLIST\n[ ] Question input\n[ ] Answer + source file\n[ ] No-answer + contact IT\n[ ] Trust disclaimer\n[ ] Feedback (optional)<\/code><\/pre>"}],"objectives":["List required UI elements","Define the no-answer state"],"checkpointQuestions":["What must appear under every valid answer?"]},"s4-1":{"summary":"Happy path and refusal path; reference wireframe for layout.","sections":[{"heading":"Overview","html":"<p><strong>Flow:<\/strong> Open Ask IT → enter question → receive answer with source <strong>or<\/strong> receive no-answer guidance → optional feedback or email IT.<\/p><p><strong>Minimum screens:<\/strong> Home (input), Answer, No answer.<\/p><p><strong>Reference wireframe (layout only):<\/strong><\/p><p>!<a href=\"/fde/retail-ask-it-wireframe.svg\">Ask IT wireframe reference<\/a><\/p><p>Use the wireframe as a layout guide; adapt labels to your BRD.<\/p>"},{"heading":"Example: Retail case","html":"<pre><code>Open Ask IT → Ask → Found → Answer screen\n                 → Not found → No-answer screen<\/code><\/pre>"}],"objectives":["Document dual-path flow","Relate wireframe to three screens"],"checkpointQuestions":["Minimum screen count?","Action after no-answer?"]},"s4-2":{"summary":"Produce flow diagram and wireframes for Home, Answer, and No answer; optional admin feedback view.","sections":[{"heading":"Procedure","html":"<ol><li>Draw the user flow (answer vs no-answer).<\/li><li>Wireframe Home, Answer, and No answer screens.<\/li><li>Optional: admin view of negative feedback entries.<\/li><li>Cross-check against the Stage 3 BRD.<\/li><\/ol>"},{"heading":"Pitfalls","html":"<ul><li>Omitting source file on Answer screen<\/li><li>No escalation path<\/li><\/ul>"}],"objectives":["Flow plus three wireframes delivered"],"checkpointQuestions":["Where is the FAQ source shown?"]},"s4-3":{"summary":"Explain UX mitigations when the model err or FAQs do not contain the answer.","sections":[{"heading":"Example: Retail case","html":"<p>\"We display the FAQ source, refuse to invent content when retrieval fails, provide a direct IT contact, and log negative feedback for the IT lead to review and update FAQs.\"<\/p>"}],"objectives":["Cover citation, refusal, escalation, feedback"],"checkpointQuestions":["Why show the source file name?"]},"s5-0":{"summary":"Browser, API, FAQ storage, retrieval, and LLM—with hosting on Render or AWS when deployed.","sections":[{"heading":"Overview","html":"<p><strong>Customer for Stages 3–9: a retail company (HQ and stores)<\/strong><\/p><ul><li>Approximately <strong>50 employees<\/strong> across stores and head office.<\/li><li>IT receives <strong>100 messages per week<\/strong>; many repeat password, Wi‑Fi, VPN, and device questions.<\/li><li>Answers exist in <strong>~15 FAQ documents<\/strong> (PDF or Word). Staff rarely read them.<\/li><li><strong>IT lead (sponsor)<\/strong> wants an internal <strong>Ask IT<\/strong> page: typed question, cited answer from FAQs, or a clear escalation to IT.<\/li><li>One <strong>restricted FAQ<\/strong> (“Admin-only IT notes”) must not appear in answers for standard staff. Only <strong>admin<\/strong> role may retrieve content from that source.<\/li><li><strong>Phase 1 scope:<\/strong> FAQ assistant only—not a full ticketing or HR system.<\/li><\/ul><p><strong>Components:<\/strong> web client, FastAPI backend, FAQ storage, retrieval (RAG), LLM API. Authentication distinguishes <strong>staff<\/strong> and <strong>admin<\/strong>; role checks occur on the server.<\/p><p><strong>Reference diagram:<\/strong><\/p><p>!<a href=\"/fde/retail-ask-it-architecture.svg\">Ask IT reference architecture<\/a><\/p><p>Pilot hosting may use <strong>Render<\/strong> or <strong>AWS<\/strong> (App Runner, Elastic Beanstalk, or equivalent); secrets via environment variables only.<\/p>"},{"heading":"Procedure","html":"<ol><li>Label each box in the diagram for your implementation.<\/li><li>Explain the data path in three minutes to a peer.<\/li><\/ol>"},{"heading":"Pitfalls","html":"<ul><li>Client-only role checks<\/li><li>API keys in source control<\/li><\/ul>"}],"objectives":["Name five architectural components","Explain staff vs admin data path"],"checkpointQuestions":["Where is role enforced?","Where do FAQ files live?"]},"s5-1":{"summary":"Tag FAQ chunks as staff_ok or admin_only; filter retrieval by authenticated role on the server.","sections":[{"heading":"Overview","html":"<p>Tag each chunk <strong>staff_ok<\/strong> or <strong>admin_only<\/strong>. Staff queries search staff_ok only; admin may search both. Enforce in FastAPI before returning any answer.<\/p><p>Store LLM and provider credentials in <strong>.env<\/strong> or host environment—never in Git.<\/p>"},{"heading":"Template","html":"<pre><code>FAQ TAGS\nFile                    | staff_ok | admin_only\nWiFi-FAQ.pdf            |    x     |\nAdmin-only-notes.pdf    |          |     x<\/code><\/pre>"}],"objectives":["Define tagging and server-side filter","Plan one staff negative test"],"checkpointQuestions":["Why server-side enforcement?"]},"s5-2":{"summary":"Monthly question volume × unit cost; expect roughly 2–5 seconds per answer with loading state.","sections":[{"heading":"Overview","html":"<p>Estimate monthly questions from user count and usage assumptions. Multiply by provider price per request. Add host cost (Render or AWS). Document a monthly range for the sponsor.<\/p><p>Show a loading indicator during retrieval and generation; set a timeout with a user-friendly error message.<\/p>"},{"heading":"Template","html":"<pre><code>Questions/month: __\nCost per question (est.): $__\nMonthly AI + host (range): $__<\/code><\/pre>"}],"objectives":["Produce a written cost range","State expected latency"],"checkpointQuestions":["What drives monthly AI cost?"]},"s5-3":{"summary":"One half-page ADR: decision, rationale, alternatives rejected.","sections":[{"heading":"Example: Retail case","html":"<pre><code>Decision: FAQ folder + RAG for phase 1.\nBecause: Existing FAQs; fastest validated outcome.\nNot chosen: Full ITSM integration in phase 1.<\/code><\/pre>"},{"heading":"Template","html":"<pre><code>ADR-001\nDecision:\nBecause:\nNot chosen:<\/code><\/pre>"}],"objectives":["Write ADR-001"],"checkpointQuestions":["What is explicitly deferred to phase 2?"]},"s5-4":{"summary":"Complete diagram labels, FAQ tag table, cost estimate, and ADR-001.","sections":[{"heading":"Procedure","html":"<ol><li>Annotate architecture diagram for your repo layout.<\/li><li>Complete FAQ tag table.<\/li><li>Fill cost template.<\/li><li>Save ADR-001 under docs/.<\/li><li>Three-minute walkthrough with a peer.<\/li><\/ol>"}],"objectives":["Deliver diagram, tags, cost, ADR"],"checkpointQuestions":["Can a peer explain the diagram back?"]},"s5-5":{"summary":"Explain how staff cannot receive answers sourced from admin-only FAQs.","sections":[{"heading":"Example: Retail case","html":"<p>\"Chunks are tagged by sensitivity. The API filters the retrieval index by role before generation. We verify with a staff login question that exists only in admin-only content—it must refuse, not leak.\"<\/p>"}],"objectives":["Explain tags, server filter, and test case"],"checkpointQuestions":["Where is the filter applied?"]},"s6-0":{"summary":"FastAPI structure, FAQ ingest, POST /ask, role parameter, secrets in environment.","sections":[{"heading":"Overview","html":"<p><strong>Customer for Stages 3–9: a retail company (HQ and stores)<\/strong><\/p><ul><li>Approximately <strong>50 employees<\/strong> across stores and head office.<\/li><li>IT receives <strong>100 messages per week<\/strong>; many repeat password, Wi‑Fi, VPN, and device questions.<\/li><li>Answers exist in <strong>~15 FAQ documents<\/strong> (PDF or Word). Staff rarely read them.<\/li><li><strong>IT lead (sponsor)<\/strong> wants an internal <strong>Ask IT<\/strong> page: typed question, cited answer from FAQs, or a clear escalation to IT.<\/li><li>One <strong>restricted FAQ<\/strong> (“Admin-only IT notes”) must not appear in answers for standard staff. Only <strong>admin<\/strong> role may retrieve content from that source.<\/li><li><strong>Phase 1 scope:<\/strong> FAQ assistant only—not a full ticketing or HR system.<\/li><\/ul><p><strong>Backend deliverables:<\/strong> ingest FAQ files; tag chunks; expose <code>POST /ask<\/code> with question and role; return answer + <code>source_file<\/code> or structured refusal; enforce role filter before search.<\/p><p><strong>Acceptance target (with sponsor):<\/strong> 16+ of 20 regression questions correct, zero admin leaks, source on every valid answer.<\/p>"},{"heading":"Pitfalls","html":"<ul><li>Secrets in Git<\/li><li>Role check only in UI<\/li><\/ul>"}],"objectives":["List backend endpoints and role rules"],"checkpointQuestions":["Where is role validated?"]},"s6-1":{"summary":"Ask IT screens per wireframes: input, answer with source, no-answer state, optional feedback.","sections":[{"heading":"Overview","html":"<p>Implement Home, Answer, and No-answer views from Stage 4. Display loading state during API calls. Surface API errors without stack traces.<\/p><p>Optional: staff/admin login selector or test accounts for regression.<\/p>"}],"objectives":["Map wireframes to components","Handle loading and errors"],"checkpointQuestions":["What displays on timeout?"]},"s6-2":{"summary":"Retrieve FAQ chunks, generate answers with citations; refuse when retrieval is insufficient.","sections":[{"heading":"Overview","html":"<p>Reuse Stage 2 retrieval patterns. Pass only role-allowed chunks to the generator. Include source file name in the response. When no chunk meets threshold, return the no-answer message—do not hallucinate policy content.<\/p>"}],"objectives":["Describe retrieval + generation boundary","Define refusal condition"],"checkpointQuestions":["When do you refuse to answer?"]},"s6-3":{"summary":"FAQ file layout, chunk metadata, staff_ok/admin_only tags, sample data for tests.","sections":[{"heading":"Overview","html":"<p>Store FAQs as files or normalized tables; maintain metadata: file name, chunk id, sensitivity tag. Version sample FAQs for regression. Document how to add or update a FAQ and rerun tests.<\/p>"},{"heading":"Template","html":"<pre><code>Chunk metadata: file_name, tag (staff_ok | admin_only), chunk_id<\/code><\/pre>"}],"objectives":["Document FAQ metadata schema","Provide sample FAQs for pilot"],"checkpointQuestions":["How are admin-only files marked?"]},"s6-4":{"summary":"CSV with normal, edge, out-of-scope, and admin-as-staff cases for acceptance.","sections":[{"heading":"Overview","html":"<p>Create <code>tests/questions.csv<\/code>: ~12 standard, ~4 edge, ~2 out-of-scope (expect refusal), ~2 admin-only topics asked as <strong>staff<\/strong> (must not leak). Reuse in Stages 7–9.<\/p>"},{"heading":"Example: Retail case","html":"<pre><code>id,question,expected_file,user_role,notes\n1,Reset password?,Password-FAQ.pdf,staff,\n2,Server room code?,Admin-only.pdf,staff,must refuse<\/code><\/pre>"}],"objectives":["Publish 20-row CSV","Include admin leak test rows"],"checkpointQuestions":["Which rows test admin isolation?"]},"s6-5":{"summary":"Document build plan, add sample FAQ files, complete questions.csv.","sections":[{"heading":"Procedure","html":"<ol><li>Write development plan (scope + acceptance numbers).<\/li><li>Add 3–5 sample FAQ files with tags.<\/li><li>Complete questions.csv; peer-review five rows.<\/li><\/ol>"}],"objectives":["Plan, sample data, and CSV ready"],"checkpointQuestions":["Acceptance numbers agreed?"]},"s6-6":{"summary":"End-to-end localhost build; run 20-question regression; short results report.","sections":[{"heading":"Procedure","html":"<ol><li>Backend ingest, ask API, role filter.<\/li><li>Frontend wired to API.<\/li><li>Execute all CSV rows; log pass/fail.<\/li><li>Fix highest-impact failure; rerun failed rows.<\/li><li>Write results summary.<\/li><\/ol>"},{"heading":"Template","html":"<pre><code>RESULTS\nCorrect: __/20\nAdmin leaks: __ (target 0)\nTop failure:\nFix:<\/code><\/pre>"}],"objectives":["Localhost E2E","Regression logged"],"checkpointQuestions":["Met acceptance threshold?"]},"s6-7":{"summary":"Defer out-of-scope requests using the BRD and acceptance criteria.","sections":[{"heading":"Example: Retail case","html":"<p>\"I will log tickets for phase 2. Phase 1 completes the FAQ assistant and the agreed regression score. Let us finish acceptance on the current plan, then schedule an scope review.\"<\/p>"}],"objectives":["Reference written scope and metrics"],"checkpointQuestions":["Which document defines phase 1?"]},"s7-0":{"summary":"Development on localhost; MVP/POC adds repeatable run plus Render pilot URL; production is Stage 8 hardening on Render or AWS.","sections":[{"heading":"Overview","html":"<ul><li><strong>Development (Stage 6):<\/strong> feature-complete slice on localhost.<\/li><li><strong>MVP/POC (this stage):<\/strong> documented startup, staff/admin login, UI polish, <strong>Render POC URL<\/strong> for sponsor demo, regression and pilots.<\/li><li><strong>Production (Stage 8):<\/strong> production posture on <strong>Render or AWS<\/strong>, runbook, monitoring.<\/li><\/ul><p><strong>Customer for Stages 3–9: a retail company (HQ and stores)<\/strong><\/p><ul><li>Approximately <strong>50 employees<\/strong> across stores and head office.<\/li><li>IT receives <strong>100 messages per week<\/strong>; many repeat password, Wi‑Fi, VPN, and device questions.<\/li><li>Answers exist in <strong>~15 FAQ documents<\/strong> (PDF or Word). Staff rarely read them.<\/li><li><strong>IT lead (sponsor)<\/strong> wants an internal <strong>Ask IT<\/strong> page: typed question, cited answer from FAQs, or a clear escalation to IT.<\/li><li>One <strong>restricted FAQ<\/strong> (“Admin-only IT notes”) must not appear in answers for standard staff. Only <strong>admin<\/strong> role may retrieve content from that source.<\/li><li><strong>Phase 1 scope:<\/strong> FAQ assistant only—not a full ticketing or HR system.<\/li><\/ul><p>MVP/POC must-haves: login, Ask IT UI, feedback capture, full 20-question regression after material changes.<\/p>"}],"objectives":["Contrast three environments","List MVP/POC additions"],"checkpointQuestions":["What does POC add beyond localhost?"]},"s7-1":{"summary":"README, .env.example, and startup steps so a peer can run without your machine.","sections":[{"heading":"Overview","html":"<p>Document Python/Node versions, dependencies, <code>.env.example<\/code>, and start commands for backend and frontend. A peer should run from README alone.<\/p><p>Secrets remain in environment variables, not Git.<\/p>"},{"heading":"Template","html":"<pre><code>LOCAL RUN\n1. clone\n2. cp .env.example .env\n3. start backend: ___\n4. start frontend: ___\n5. URL: ___<\/code><\/pre>"}],"objectives":["README validated by peer"],"checkpointQuestions":["What blocked your peer?"]},"s7-2":{"summary":"Connect repository, configure environment variables, deploy FastAPI and static frontend, verify public POC URL.","sections":[{"heading":"Overview","html":"<p><strong>Render POC steps:<\/strong><\/p><ol><li>Push code to Git (no <code>.env<\/code> committed).<\/li><li>Create <strong>Web Service<\/strong>; connect repository; set start command (e.g. <code>uvicorn main:app<\/code>).<\/li><li>Add environment variables (LLM key, app secrets) in Render dashboard.<\/li><li>Deploy; confirm <code>/health<\/code> and one FAQ question from a device outside localhost.<\/li><li>Record POC URL for sponsor demo.<\/li><\/ol><p>Production hardening (custom domain, scaling, AWS) follows in Stage 8.<\/p>"},{"heading":"Procedure","html":"<ol><li>Confirm <code>.gitignore<\/code> excludes secrets.<\/li><li>Deploy backend; attach frontend static site or combined service per your layout.<\/li><li>Smoke-test staff login and one answered question on the public URL.<\/li><\/ol>"},{"heading":"Pitfalls","html":"<ul><li>API keys in repository<\/li><li>Skipping health check<\/li><\/ul>"}],"objectives":["Obtain working Render POC URL","Verify ask flow on public URL"],"checkpointQuestions":["Where are secrets configured on Render?"]},"s7-3":{"summary":"Run full 20-question CSV; three pilot sessions; record results and top three fixes.","sections":[{"heading":"Overview","html":"<p>Run smoke tests plus full regression; save results under <code>tests/results/<\/code>. Conduct three pilot sessions without hand-holding; note confusion points; prioritize three fixes before production stage.<\/p>"},{"heading":"Procedure","html":"<p>Regression → save scores → three pilots → top-three fix list.<\/p>"},{"heading":"Pitfalls","html":"<ul><li>Skipping regression after UI changes<\/li><li>No written pilot notes<\/li><\/ul>"}],"objectives":["Regression file updated","Three pilots and fix list"],"checkpointQuestions":["When must regression rerun?"]},"s7-4":{"summary":"Login, feedback persistence, README, local and Render POC smoke tests.","sections":[{"heading":"Procedure","html":"<ol><li>Enforce staff/admin login on server.<\/li><li>Persist thumbs-down (file or database).<\/li><li>Finalize README local and Render sections.<\/li><li>Smoke: health, one staff answer, one refusal, admin-as-staff leak test on POC URL.<\/li><\/ol>"}],"objectives":["Login and feedback on POC","Smoke tests documented"],"checkpointQuestions":["Zero admin leaks on POC?"]},"s7-5":{"summary":"Demo Render POC with cited answers, refusal, and honest limits before production.","sections":[{"heading":"Example: Retail case","html":"<p>\"I will demo on our Render POC: two answered questions with sources, one refusal, staff blocked from admin FAQ content, regression at __/20. Production runbook and AWS/Render production choice follow in Stage 8.\"<\/p>"}],"objectives":["Timeboxed honest demo outline"],"checkpointQuestions":["Include refusal in demo?"]},"s8-0":{"summary":"Always-on hosting via Render or AWS; Git-based deploy; environment secrets; health endpoint.","sections":[{"heading":"Overview","html":"<p><strong>Render:<\/strong> connect repository, set start command, configure environment variables, deploy, verify URL.<\/p><p><strong>AWS (when required):<\/strong> App Runner or Elastic Beanstalk for FastAPI; S3/CloudFront or equivalent for static frontend; RDS if database is required; Secrets Manager or parameter store for credentials; single region documented.<\/p><p><strong>Common rules:<\/strong> no secrets in Git; <code>/health<\/code> endpoint; test Ask IT from a network outside your laptop.<\/p><p><strong>Customer for Stages 3–9: a retail company (HQ and stores)<\/strong><\/p><ul><li>Approximately <strong>50 employees<\/strong> across stores and head office.<\/li><li>IT receives <strong>100 messages per week<\/strong>; many repeat password, Wi‑Fi, VPN, and device questions.<\/li><li>Answers exist in <strong>~15 FAQ documents<\/strong> (PDF or Word). Staff rarely read them.<\/li><li><strong>IT lead (sponsor)<\/strong> wants an internal <strong>Ask IT<\/strong> page: typed question, cited answer from FAQs, or a clear escalation to IT.<\/li><li>One <strong>restricted FAQ<\/strong> (“Admin-only IT notes”) must not appear in answers for standard staff. Only <strong>admin<\/strong> role may retrieve content from that source.<\/li><li><strong>Phase 1 scope:<\/strong> FAQ assistant only—not a full ticketing or HR system.<\/li><\/ul>"},{"heading":"Template","html":"<pre><code>PRODUCTION CHECKLIST\n[ ] Secrets in host env only\n[ ] /health returns OK\n[ ] Public URL tested\n[ ] One FAQ question succeeds<\/code><\/pre>"}],"objectives":["Contrast Render vs AWS use cases","List deploy safety checks"],"checkpointQuestions":["Where do production secrets live?"]},"s8-1":{"summary":"Request logs, error counts, and feedback records for the IT lead.","sections":[{"heading":"Overview","html":"<p>Log timestamp, outcome, and duration per ask request (avoid logging secrets or full API keys). Retain negative feedback with question, answer, and source for FAQ updates. Use host log dashboard (Render or AWS CloudWatch).<\/p>"},{"heading":"Template","html":"<pre><code>INCIDENT LOOKUP\n1. Open host logs\n2. Match time window\n3. Cross-check feedback file\n4. Reproduce locally<\/code><\/pre>"}],"objectives":["Enable structured request logs","Locate logs on chosen host"],"checkpointQuestions":["What not to log?"]},"s8-2":{"summary":"LLM timeout with friendly message; monitor provider spend during pilot.","sections":[{"heading":"Overview","html":"<p>Set request timeout (e.g. 30s). On failure, show a neutral message and IT contact—never raw stack traces. Review provider usage weekly during early production.<\/p>"}],"objectives":["User-safe error handling","Timeout configured"],"checkpointQuestions":["User-visible text on failure?"]},"s8-3":{"summary":"Promote POC to production posture on Render or AWS; verify URL and logs.","sections":[{"heading":"Procedure","html":"<ol><li>Deploy with production env vars.<\/li><li>Verify /health and Ask IT from external network.<\/li><li>Capture log screenshot after successful and failed request.<\/li><\/ol>"}],"objectives":["Production URL operational"],"checkpointQuestions":["Tested off localhost?"]},"s8-4":{"summary":"One-page runbook; partner simulates bad API key and recovers using runbook only.","sections":[{"heading":"Template","html":"<pre><code>RUNBOOK\nURL:\nHealth:\nLogs location:\nIf API errors: check ___ env var\nIf slow: check provider status\nContact:<\/code><\/pre>"}],"objectives":["Runbook validated by drill"],"checkpointQuestions":["Missing step identified?"]},"s8-5":{"summary":"Checklist before all staff use Ask IT daily.","sections":[{"heading":"Example: Retail case","html":"<p>\"Confirm production URL, secrets, role enforcement, runbook, IT lead review of negative feedback, FAQ ownership, and regression after any FAQ update.\"<\/p>"}],"objectives":["List five rollout gates"],"checkpointQuestions":["Why rerun regression after FAQ edits?"]},"s9-0":{"summary":"Five direct answers: data, hosting, admin FAQ isolation, secrets, wrong-answer handling.","sections":[{"heading":"Overview","html":"<p><strong>Customer for Stages 3–9: a retail company (HQ and stores)<\/strong><\/p><ul><li>Approximately <strong>50 employees<\/strong> across stores and head office.<\/li><li>IT receives <strong>100 messages per week<\/strong>; many repeat password, Wi‑Fi, VPN, and device questions.<\/li><li>Answers exist in <strong>~15 FAQ documents<\/strong> (PDF or Word). Staff rarely read them.<\/li><li><strong>IT lead (sponsor)<\/strong> wants an internal <strong>Ask IT<\/strong> page: typed question, cited answer from FAQs, or a clear escalation to IT.<\/li><li>One <strong>restricted FAQ<\/strong> (“Admin-only IT notes”) must not appear in answers for standard staff. Only <strong>admin<\/strong> role may retrieve content from that source.<\/li><li><strong>Phase 1 scope:<\/strong> FAQ assistant only—not a full ticketing or HR system.<\/li><\/ul><ol><li><strong>Data processed:<\/strong> FAQ text and user questions (no credentials in FAQs).<\/li><li><strong>Hosting:<\/strong> production URL; FAQ storage location.<\/li><li><strong>Admin content:<\/strong> server-side role filter; staff cannot retrieve admin-only chunks.<\/li><li><strong>Secrets:<\/strong> environment variables on Render/AWS—not in Git.<\/li><li><strong>Incorrect answers:<\/strong> source citation, refusal path, feedback to IT lead.<\/li><\/ol>"},{"heading":"Template","html":"<pre><code>SECURITY ANSWERS\n1 Data:\n2 Hosting:\n3 Admin FAQ:\n4 Secrets:\n5 Wrong answers:<\/code><\/pre>"}],"objectives":["Complete five answers with specifics"],"checkpointQuestions":["Evidence for admin isolation?"]},"s9-1":{"summary":"Instrument ask requests in Langfuse; attach regression scores; export evidence for IT and sponsor.","sections":[{"heading":"Overview","html":"<p><strong>Langfuse<\/strong> provides trace history per question (latency, retrieval, model call) and supports evaluation datasets.<\/p><p>Configure Langfuse keys via environment variables. Log each <code>/ask<\/code> invocation with correlation id. Import or score the 20-question regression set; store summary scores for handover.<\/p><p>Do not log API keys or full restricted FAQ text in traces.<\/p>"},{"heading":"Procedure","html":"<ol><li>Create Langfuse project; add keys to .env.<\/li><li>Wrap ask pipeline with trace context.<\/li><li>Run regression; record scores in Langfuse or linked report.<\/li><li>Capture one trace screenshot for security pack.<\/li><\/ol>"},{"heading":"Pitfalls","html":"<ul><li>Secrets in trace payloads<\/li><li>No eval record after FAQ change<\/li><\/ul>"}],"objectives":["Langfuse receiving traces","Regression scores documented"],"checkpointQuestions":["What do you show IT from Langfuse?"]},"s9-2":{"summary":"Five-minute structure: scope, demo proof, risks, ask; README, runbook, security, tests.","sections":[{"heading":"Overview","html":"<p><strong>Readout:<\/strong> what was built → evidence (regression, pilots, Langfuse) → risks and mitigations → decision request.<\/p><p><strong>Handover:<\/strong> README, runbook.md, security-answers.md, questions.csv, Langfuse eval summary, .env.example.<\/p>"},{"heading":"Template","html":"<pre><code>READOUT (5 min)\nBuilt:\nEvidence:\nRisks:\nAsk sponsor:\nHANDOVER FILES: ...<\/code><\/pre>"}],"objectives":["Outline readout","List handover artifacts"],"checkpointQuestions":["What do you ask the sponsor to decide?"]},"s9-3":{"summary":"Document future SSO, ticketing, or intranet embedding without building in phase 1.","sections":[{"heading":"Overview","html":"<p>Record phase 2 candidates: corporate identity provider, ticket creation handoff, intranet link. One slide <strong>Now vs Later<\/strong> is sufficient for this workshop.<\/p>"}],"objectives":["Name two phase 2 items"],"checkpointQuestions":["What remains in phase 1?"]},"s9-4":{"summary":"Connect Langfuse, execute regression with tracing, export eval summary for handover.","sections":[{"heading":"Procedure","html":"<ol><li>Configure Langfuse on localhost or production URL.<\/li><li>Run full 20-question set; confirm traces.<\/li><li>Save eval summary and one trace screenshot.<\/li><li>Update security-answers.md with observability evidence.<\/li><\/ol>"}],"objectives":["Traces and eval summary delivered"],"checkpointQuestions":["Any secret leaked in traces?"]},"s9-5":{"summary":"Five-minute timed readout plus two-minute demo.","sections":[{"heading":"Procedure","html":"<p>Prepare four bullets → rehearse with timer → incorporate feedback.<\/p>"}],"objectives":["Readout within time limit"],"checkpointQuestions":["Clear sponsor ask?"]},"s9-6":{"summary":"Align with IT on approved providers; rerun regression on approved model.","sections":[{"heading":"Example: Retail case","html":"<p>\"I request the approved model list from IT, rerun the 20-question regression on the approved endpoint, and compare scores before switching production configuration.\"<\/p>"}],"objectives":["IT alignment and retest"],"checkpointQuestions":["Why rerun regression?"]},"s9-7":{"summary":"Professional deferral to phase 2 with reference to BRD.","sections":[{"heading":"Example: Retail case","html":"<p>\"Ticketing is scheduled for phase 2 after FAQ assistant acceptance. We will complete regression and pilot evidence for phase 1 first.\"<\/p>"}],"objectives":["Defer with written scope reference"],"checkpointQuestions":["Phase 1 vs phase 2?"]},"s10-0":{"summary":"Scope, sequence, stack, and evaluation weights for the three capstone modules.","sections":[{"heading":"Overview","html":"<p>This capstone applies delivery practices from Stages 3–9 at e-commerce scale. The retail Ask IT exercise is complete; this work is the <strong>Ecommerce Multi RAG agent<\/strong> track.<\/p><p><strong>Ecommerce Multi RAG agent<\/strong> is the capstone sequence: three integrated modules on a shared stack (React, FastAPI, PostgreSQL). Complete modules in order.<\/p><ol><li><strong>Ecommerce Full stack<\/strong> — catalog, cart, checkout, orders.<\/li><li><strong>Ecommerce Multi Agent<\/strong> — LangGraph agents with tools over live store data (scoped writes).<\/li><li><strong>Ecommerce Agentic RAG<\/strong> — FAISS over approved product manuals; cited answers; no cart mutations.<\/li><\/ol><p>Shared rules: one frontend and API; separate backend packages for multi-agent and agentic RAG; Langfuse for traces and evals; secrets via environment variables only.<\/p><pre><code>backend/\n  app/\n  ecommerce/\n  agents/multi_agent/\n  agents/agentic_rag/\nfrontend/<\/code><\/pre><p>Maintain a brief decision log per module. Do not commit credentials to Git.<\/p>"},{"heading":"Procedure","html":"<p>Work packages:<\/p><ol><li>Ecommerce Full stack<\/li><li>Ecommerce Multi Agent<\/li><li>Ecommerce Agentic RAG<\/li><\/ol><p>Complete modules in order. Each module includes build, smoke test, and short handover notes (environment, limits, eval summary where applicable).<\/p>"},{"heading":"Pitfalls","html":"<ul><li>Starting AI modules before commerce checkout is validated.<\/li><li>Mixing RAG ingestion with multi-agent tool code without boundaries.<\/li><li>Hard-coded API keys or database URLs in the repository.<\/li><\/ul>"},{"heading":"Evaluation criteria","html":"<pre><code>Module                    Requirement                              Weight\nEcommerce Full stack      Checkout works before AI modules         35%\nEcommerce Multi Agent     Live DB tools; isolated package          30%\nEcommerce Agentic RAG     FAISS + citations; no cart writes        35%<\/code><\/pre>"}],"objectives":["State module order and shared stack","Map acceptance criteria to three modules"],"checkpointQuestions":["Which module uses FAISS vs live database tools?","Where does Langfuse attach?"]},"s10-1":{"summary":"Catalog, cart, checkout, auth, and PostgreSQL schema; commerce works without AI.","sections":[{"heading":"Overview","html":"<p>Deliver storefront flows: browse, cart, checkout, order persistence. Minimal admin or seeded catalog is acceptable for v1.<\/p><p><strong>Module time (~190 min workshop block):<\/strong> ~30 min planning and checklist; ~120 min core implementation milestone; ~25 min smoke test; ~15 min handover notes.<\/p>"},{"heading":"Procedure","html":"<ol><li>Schema: users, products, cart, orders.<\/li><li>FastAPI routes and React pages.<\/li><li>One full purchase on localhost.<\/li><li>Document API list and local setup in README.<\/li><\/ol>"}],"objectives":["End-to-end purchase without AI","Schema documented"],"checkpointQuestions":["Checkout with AI modules disabled?"]},"s10-2":{"summary":"LangGraph agents, live store tools, isolated agents/multi_agent/, Langfuse traces.","sections":[{"heading":"Overview","html":"<p>First chat surface in the React app. Code under <code>agents/multi_agent/<\/code>. Tools read inventory and pricing; writes only on an explicit allow list.<\/p><p><strong>Module time (~190 min):<\/strong> tool contracts, graph orchestration, UI wiring, five scripted store queries, trace review in Langfuse.<\/p>"},{"heading":"Procedure","html":"<ol><li>Define tool schemas and authorization rules.<\/li><li>Implement LangGraph flow.<\/li><li>Expose chat API and connect UI.<\/li><li>Langfuse trace on each turn.<\/li><li>Run five scripted store questions.<\/li><\/ol>"}],"objectives":["Isolated package","Live DB tools","Langfuse traces"],"checkpointQuestions":["Actions out of scope for this module?"]},"s10-3":{"summary":"FAISS over manuals, second chat UI, citations, agents/agentic_rag/, read-only for orders.","sections":[{"heading":"Overview","html":"<p>Second chat surface. Ingest approved PDFs/text into FAISS with metadata. RAG path does not mutate carts or orders.<\/p><p><strong>Module time (~190 min):<\/strong> ingestion pipeline, cited answers, ten-question eval set, Langfuse or written eval summary, module handover.<\/p>"},{"heading":"Procedure","html":"<ol><li>Build FAISS index with metadata.<\/li><li>RAG flow with citations in responses.<\/li><li>Second chat panel in frontend.<\/li><li>Ten document-grounded eval questions with recorded scores.<\/li><\/ol>"}],"objectives":["FAISS reproducible","Cited answers","Separate from multi-agent writes"],"checkpointQuestions":["Example response with document citation?"]}};

function pts(a){if(!a||!a.length)return "";return '<ul class="pts">'+a.map(function(t){return '<li>'+esc(t)+'</li>'}).join("")+'</ul>'}
var body="";(c.sections||[]).forEach(function(sec){body+='<h4>'+esc(sec.heading)+'</h4><div class="prose">'+sec.html+'</div>'});

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deployment Phase - Multi-Agent E-commerce Assistant</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../shared/styles.css">
    <style>
        /* Phase-specific styles */
        .phase-active .sidebar-nav-btn.active {
            background: #eff6ff;
            color: #1e40af;
        }

        .phase-active .next-btn {
            background: linear-gradient(to right, #3b82f6, #2563eb);
        }
    </style>
</head>

<body class="phase-active">
    <!-- Phase Navigation Bar -->
    <div class="phase-nav-container">
        <div class="phase-nav-wrapper">
            <div class="phase-nav-line"></div>
            <div class="phase-nav-buttons">
                <button class="phase-nav-btn" data-phase="brd" title="Business Requirements">
                    <div class="phase-nav-circle phase-brd">📋</div>
                    <div class="phase-nav-label">BRD</div>
                </button>
                <button class="phase-nav-btn" data-phase="uiux" title="UI/UX Design">
                    <div class="phase-nav-circle phase-uiux">🎨</div>
                    <div class="phase-nav-label">UI/UX</div>
                </button>
                <button class="phase-nav-btn" data-phase="architectural" title="Architectural Design">
                    <div class="phase-nav-circle phase-architectural">🏗️</div>
                    <div class="phase-nav-label">Architecture</div>
                </button>
                <button class="phase-nav-btn" data-phase="code-development" title="Code Development">
                    <div class="phase-nav-circle phase-development">💻</div>
                    <div class="phase-nav-label">Development</div>
                </button>
                <button class="phase-nav-btn" data-phase="testing" title="Testing & QA">
                    <div class="phase-nav-circle phase-testing">🧪</div>
                    <div class="phase-nav-label">Testing</div>
                </button>
                <button class="phase-nav-btn active" data-phase="deployment" title="Deployment">
                    <div class="phase-nav-circle phase-deployment active">🚀</div>
                    <div class="phase-nav-label">Deployment</div>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="back-btn" onclick="window.location.href='../index.html'">
                    <span>←</span>
                    <span>Back to Projects</span>
                </button>
                <h1 class="sidebar-title">Deployment Phase</h1>
                <p class="sidebar-subtitle">Multi-Agent Assistant</p>
            </div>

            <div class="sidebar-nav">
                <ul class="sidebar-nav-list" id="sidebar-nav">
                    <!-- Navigation items will be dynamically generated -->
                </ul>
            </div>

            <div class="sidebar-progress">
                <div class="progress-title">Phase Progress</div>
                <div class="progress-list" id="progress-list">
                    <!-- Progress items will be dynamically generated -->
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="content-area">
            <div class="content-wrapper">
                <div id="current-content">
                    <!-- Content will be dynamically loaded here -->
                </div>

                <button id="next-btn" class="next-btn">
                    <span>Next Module</span>
                    <span class="next-btn-arrow">→</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-container">
            <div class="footer-grid">
                <div>
                    <a href="/" class="footer-logo">
                        <img src="../lms_logo.svg" alt="GNANAM AI">
                    </a>
                    <p class="footer-description">
                        Launching the future of e-commerce interaction through scalable agentic infrastructure.
                    </p>
                </div>
            </div>
            <div class="footer-bottom">
                <p class="footer-copyright">© 2026 GNANAM AI. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Page Data for JavaScript -->
    <script type="application/json" id="page-data">
    {"phase": "deployment", "projectTitle": "Multi-Agent E-commerce Assistant"}
  </script>

    <!-- Navigation Script -->
    <script src="../shared/navigation.js"></script>
</body>

</html>
